name = "stave-lean"
version = "0.1.0"
defaultTargets = ["Stave"]

[[lean_lib]]
name = "Stave"

[[lean_exe]]
name = "bridge-check"
root = "Stave.Compose.BridgeMain"

[[lean_exe]]
name = "network-bridge-check"
root = "Stave.Network.BridgeMain"

[[lean_exe]]
name = "iam-bridge-check"
root = "Stave.IAM.BridgeMain"

[[lean_exe]]
name = "xaccount-bridge-check"
root = "Stave.CrossAccount.BridgeMain"

[[lean_exe]]
name = "celtype-bridge-check"
root = "Stave.Schema.BridgeMain"

[[require]]
name = "mathlib"
scope = "leanprover-community"
